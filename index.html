<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Анкета для консультации</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #0b0b18;
    --bg-panel: #181832;
    --bg-field: #2c2c52;
    --gold: #d4af37;
    --gold-light: #f0d78c;
    --gold-dim: #8a742a;
    --text-main: #f5f4fa;
    --text-muted: #b7b4d4;
    --border: #46466e;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--bg-deep);
    font-family: 'Cormorant Garamond', serif;
    color: var(--text-main);
    padding-bottom: 0;
  }

  .footer-roots {
    position: relative;
    overflow: hidden;
    height: 260px;
    margin-top: 40px;
    background-image: url("background.jpg");
    background-position: center bottom;
    background-size: cover;
    background-repeat: no-repeat;
  }

  .footer-roots::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom,
      var(--bg-deep) 0%,
      rgba(11,11,24,0.5) 20%,
      rgba(11,11,24,0.15) 45%,
      rgba(11,11,24,0.05) 70%);
    pointer-events: none;
  }

  .stars-bg { display: none; }

  .hero {
    position: relative;
    text-align: center;
    padding: 56px 24px 34px;
    z-index: 1;
    overflow: hidden;
    background-image: url("background.jpg");
    background-position: center 62%;
    background-size: cover;
    background-repeat: no-repeat;
  }

  .hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom,
      rgba(11,11,24,0.55) 0%,
      rgba(11,11,24,0.25) 30%,
      rgba(11,11,24,0.35) 60%,
      var(--bg-deep) 100%);
    pointer-events: none;
    z-index: 0;
  }

  .hero > * {
    position: relative;
    z-index: 1;
  }

  .hero-halo {
    position: relative;
    width: 220px;
    height: 220px;
    margin: 0 auto 4px;
  }

  .hero-halo svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .hero-halo .author-photo-wrap {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    margin: 0;
  }

  .corner-photo { position: fixed; top: 20px; left: 20px; z-index: 5; }
  .corner-photo .author-photo-wrap { width: 84px; height: 84px; margin: 0; }

  .hero svg { display: block; margin: 0 auto 8px; }

  .author-photo-wrap {
    position: relative;
    width: 152px;
    height: 152px;
    margin: 0 auto 18px;
  }

  .author-photo-ring {
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, var(--gold), var(--gold-light), var(--gold-dim), var(--gold));
    opacity: 0.9;
  }

  .author-photo-ring::after {
    content: "";
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    background: var(--bg-deep);
  }

  .author-photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    box-shadow: 0 0 30px rgba(212,175,55,0.35);
  }

  .hero-title {
    display: inline-block;
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: 24px;
    letter-spacing: 4px;
    color: var(--gold-light);
    background: rgba(11,11,24,0.72);
    border: 1px solid rgba(212,175,55,0.5);
    border-radius: 10px;
    padding: 10px 28px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.8);
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    margin: 14px 0 6px;
  }

  .hero-subtitle {
    display: inline-block;
    font-size: 20px;
    color: #ffffff;
    background: rgba(11,11,24,0.55);
    padding: 14px 22px;
    border-radius: 12px;
    max-width: 440px;
    margin: 0 auto;
    line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }

  .anketa-wrap {
    position: relative;
    z-index: 1;
    max-width: 580px;
    margin: 0 auto;
    padding: 0 24px 0;
  }

  .anketa-panel {
    background: rgba(14, 14, 30, 0.94);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  .anketa-field { margin-bottom: 18px; }

  .anketa-field label {
    display: block;
    font-family: 'Cinzel', serif;
    font-size: 12.5px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--gold-light);
    margin-bottom: 8px;
    font-weight: 600;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9);
  }

  .anketa-field input,
  .anketa-field textarea,
  .anketa-field select {
    width: 100%;
    padding: 12px 14px;
    font-size: 17px;
    font-family: 'Cormorant Garamond', serif;
    color: var(--text-main);
    background: var(--bg-field);
    border: 1px solid var(--border);
    border-radius: 8px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .anketa-field input::placeholder,
  .anketa-field textarea::placeholder { color: #9491b8; }

  .anketa-field input:focus,
  .anketa-field textarea:focus,
  .anketa-field select:focus {
    outline: none;
    background: #35355e;
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(212,175,55,0.2);
  }

  .anketa-field textarea { min-height: 76px; resize: vertical; }

  .anketa-field select {
    appearance: none;
    background-repeat: no-repeat;
    background-position: right 14px center;
  }

  .anketa-submit {
    width: 100%;
    padding: 15px;
    font-family: 'Cinzel', serif;
    font-size: 15px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-weight: 600;
    color: #16162b;
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 10px;
    transition: transform 0.15s, box-shadow 0.15s;
  }

  .anketa-submit:hover:not(:disabled) {
    box-shadow: 0 6px 24px rgba(212,175,55,0.35);
    transform: translateY(-1px);
  }

  .anketa-submit:disabled { opacity: 0.6; cursor: default; }

  .anketa-status { margin-top: 16px; font-size: 16px; text-align: center; }
  .anketa-status.ok { color: #b7e3a0; }
  .anketa-status.err { color: #e39a9a; }

  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 26px 0;
    color: var(--gold-dim);
  }
  .divider::before,
  .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-halo">
    <svg viewBox="0 0 200 200" fill="none">
      <circle cx="100" cy="100" r="98" stroke="#d4af37" stroke-width="1" opacity="0.45"/>
      <circle cx="100" cy="100" r="86" stroke="#d4af37" stroke-width="1" opacity="0.3"/>
      <g stroke="#d4af37" stroke-width="1" opacity="0.5">
        <line x1="100" y1="2" x2="100" y2="198"/>
        <line x1="2" y1="100" x2="198" y2="100"/>
        <line x1="30" y1="30" x2="170" y2="170"/>
        <line x1="170" y1="30" x2="30" y2="170"/>
      </g>
      <g fill="#f0d78c">
        <circle cx="100" cy="2" r="2.6"/>
        <circle cx="100" cy="198" r="2.6"/>
        <circle cx="2" cy="100" r="2.6"/>
        <circle cx="198" cy="100" r="2.6"/>
        <circle cx="30" cy="30" r="2"/>
        <circle cx="170" cy="170" r="2"/>
        <circle cx="170" cy="30" r="2"/>
        <circle cx="30" cy="170" r="2"/>
      </g>
    </svg>
    <div class="author-photo-wrap">
      <div class="author-photo-ring"></div>
      <img class="author-photo" src="photo.jpg" alt="Астролог">
    </div>
  </div>
  <div class="hero-subtitle">Прежде чем мы начнём консультацию, ответьте, пожалуйста, на несколько вопросов — это поможет мне глубже разобрать вашу ситуацию.</div>
  <div class="hero-title">АНКЕТА</div>
</div>

<div class="anketa-wrap">
  <div class="anketa-panel">
    <form id="anketaForm">

      <div class="anketa-field">
        <label>ФИО полностью (включая девичью фамилию)</label>
        <input type="text" name="fio" required>
      </div>

      <div class="anketa-field">
        <label>Дата рождения</label>
        <input type="text" name="birth_date" placeholder="ДД.ММ.ГГГГ" required>
      </div>

      <div class="anketa-field">
        <label>Точное время рождения (если есть данные, если нет — примерно)</label>
        <input type="text" name="birth_time">
      </div>

      <div class="anketa-field">
        <label>Место рождения (город, населённый пункт)</label>
        <input type="text" name="birth_place">
      </div>

      <div class="anketa-field">
        <label>Контакт для связи (Telegram, WhatsApp, e-mail)</label>
        <input type="text" name="contact" required>
      </div>

      <div class="divider">ситуация</div>

      <div class="anketa-field">
        <label>Опишите вашу ситуацию или вопрос (что хотите разобрать? чего ожидаете от консультации?)</label>
        <textarea name="situation"></textarea>
      </div>

      <div class="anketa-field">
        <label>Как давно беспокоит эта ситуация?</label>
        <select name="duration">
          <option value="">Выберите вариант</option>
          <option>Менее месяца</option>
          <option>От месяца до года</option>
          <option>Более года</option>
          <option>С детства</option>
          <option>Повторяющийся сценарий в роду</option>
        </select>
      </div>

      <div class="anketa-field">
        <label>Что вы уже предпринимали для решения этого вопроса? (медицина, психология, ремонты, переезды...)</label>
        <textarea name="already_tried"></textarea>
      </div>

      <div class="anketa-field">
        <label>Есть ли официальные медицинские диагнозы? Если да, перечислите</label>
        <textarea name="diagnoses"></textarea>
      </div>

      <div class="anketa-field">
        <label>В какой момент жизни появился симптом или обострение? Что предшествовало?</label>
        <textarea name="symptom_onset"></textarea>
      </div>

      <div class="divider">объект (если применимо)</div>

      <div class="anketa-field">
        <label>О каком объекте речь? (новостройка, частный дом, вторичное жильё, земля, коммерция)</label>
        <input type="text" name="object_type">
      </div>

      <div class="anketa-field">
        <label>В чём именно заключается проблема с объектом? (трещины, протечки, затягивание ремонта, ссоры с подрядчиками, дискомфорт в уже готовом доме)</label>
        <textarea name="object_problem"></textarea>
      </div>

      <div class="anketa-field">
        <label>Адрес объекта (для анализа пространства, если требуется)</label>
        <input type="text" name="object_address">
      </div>

      <div class="divider">семья и род</div>

      <div class="anketa-field">
        <label>Укажите ФИО и даты рождения ключевых членов семьи, которых мы будем разбирать (супруг, партнёр, дети)</label>
        <textarea name="family_members"></textarea>
      </div>

      <div class="anketa-field">
        <label>Что вам известно о судьбе ваших родителей и бабушек/дедушек? (разводы, ранние смерти, потери имущества, репрессии, переезды, болезни, повторяющиеся профессии)</label>
        <textarea name="family_history"></textarea>
      </div>

      <div class="anketa-field">
        <label>Есть ли у вас готовое родовое древо или фото/сканы свидетельств о рождении/браке старшего поколения?</label>
        <input type="text" name="family_tree" placeholder="да, есть / нет, но могу найти / нет">
      </div>

      <button type="submit" class="anketa-submit" id="anketaSubmitBtn">Сохранить</button>
      <div class="anketa-status" id="anketaStatus"></div>

    </form>
  </div>
</div>

<div class="footer-roots"></div>

<script>
(function () {
  var form = document.getElementById("anketaForm");
  var btn = document.getElementById("anketaSubmitBtn");
  var statusEl = document.getElementById("anketaStatus");

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    statusEl.textContent = "";
    statusEl.className = "anketa-status";
    btn.disabled = true;
    btn.textContent = "Отправка...";

    var formData = new FormData(form);
    var data = {};
    formData.forEach(function (value, key) { data[key] = value; });

    fetch("/api/send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    })
      .then(function (res) { return res.json(); })
      .then(function (result) {
        if (result.success) {
          statusEl.textContent = "Спасибо! Анкета сохранена.";
          statusEl.classList.add("ok");
          form.reset();
        } else {
          statusEl.textContent = "Ошибка отправки. Попробуйте ещё раз.";
          statusEl.classList.add("err");
        }
      })
      .catch(function () {
        statusEl.textContent = "Ошибка сети. Попробуйте ещё раз.";
        statusEl.classList.add("err");
      })
      .finally(function () {
        btn.disabled = false;
        btn.textContent = "Сохранить";
      });
  });
})();
</script>

</body>
</html>
